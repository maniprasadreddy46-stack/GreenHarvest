# ===== GreenHarvest backend configuration =====
# Values come from environment variables, or from backend/.env (copy .env.example to .env).
spring.config.import=optional:file:.env[.properties]

spring.application.name=greenharvest
server.port=8080

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:greenharvest}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ----- JPA / Hibernate -----
# "update" creates/updates tables automatically from the entities (good for a college project).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- JWT (secret MUST be set, at least 32 characters) -----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ----- CORS: the React dev server address -----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ----- First admin account, created on first start if no admin exists -----
app.admin.email=${ADMIN_EMAIL:admin@greenharvest.local}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:GreenHarvest Admin}

# Hide stack traces in API error responses
server.error.include-stacktrace=never
server.error.include-message=never
